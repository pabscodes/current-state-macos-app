name: CurrentState
options:
  bundleIdPrefix: com.pabscodes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

targets:
  CurrentState:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pabscodes.currentstate
        PRODUCT_NAME: Current State
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Current State
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Current State uses Claude Code to access your apps (Things 3, Calendar, etc.) for daily briefings."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Current State reads your calendar via Claude Code to include upcoming events in briefings."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Current State accesses reminders via Claude Code for task summaries."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Current State may access your Downloads folder via Claude Code when generating briefings."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Current State may access your Desktop folder via Claude Code when generating briefings."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Current State may access your Documents folder via Claude Code when generating briefings."
    entitlements:
      path: Resources/CurrentState.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: MarkdownUI

  CurrentStateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CurrentState
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Current State.app/Contents/MacOS/Current State"
        BUNDLE_LOADER: "$(TEST_HOST)"
